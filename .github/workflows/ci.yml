name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  compile:
    name: Compile / OTP ${{ matrix.otp }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        otp: ['28', '29']
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          rebar3-version: '3.27'
      - name: Restore rebar3 cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/rebar3
            _build
          key: ${{ runner.os }}-rebar3-${{ matrix.otp }}-${{ hashFiles('rebar.lock') }}
          restore-keys: |
            ${{ runner.os }}-rebar3-${{ matrix.otp }}-
      - name: Compile
        run: rebar3 compile

  tests:
    name: Tests / OTP ${{ matrix.otp }}
    needs: compile
    runs-on: ubuntu-latest
    strategy:
      matrix:
        otp: ['28', '29']
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          rebar3-version: '3.27'
      - name: Restore rebar3 cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/rebar3
            _build
          key: ${{ runner.os }}-rebar3-${{ matrix.otp }}-${{ hashFiles('rebar.lock') }}
          restore-keys: |
            ${{ runner.os }}-rebar3-${{ matrix.otp }}-
      - name: Run eunit
        run: rebar3 eunit
      - name: Run common_test
        run: rebar3 ct

  examples:
    name: Examples / OTP ${{ matrix.otp }}
    needs: compile
    runs-on: ubuntu-latest
    strategy:
      matrix:
        otp: ['28', '29']
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          rebar3-version: '3.27'
      - name: Set up _checkouts symlinks
        run: make examples-setup
      - name: Run example suites
        run: make examples-test

  interop:
    name: Python interop / OTP 28
    needs: compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '28'
          rebar3-version: '3.27'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run the a2a-sdk interop suite
        run: make interop-python

  format:
    name: Format check
    needs: compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '29'
          rebar3-version: '3.27'
      - run: rebar3 fmt --check

  lint:
    name: Lint
    needs: compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '29'
          rebar3-version: '3.27'
      - run: rebar3 lint

  xref:
    name: Xref / OTP ${{ matrix.otp }}
    needs: compile
    runs-on: ubuntu-latest
    strategy:
      matrix:
        otp: ['28', '29']
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          rebar3-version: '3.27'
      - run: rebar3 xref

  dialyzer:
    name: Dialyzer / OTP ${{ matrix.otp }}
    needs: compile
    runs-on: ubuntu-latest
    strategy:
      matrix:
        otp: ['28', '29']
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          rebar3-version: '3.27'
      - name: Restore PLT cache
        uses: actions/cache@v4
        with:
          path: _build/default/*_plt
          key: ${{ runner.os }}-plt-${{ matrix.otp }}-${{ hashFiles('rebar.lock') }}
      - run: rebar3 dialyzer
